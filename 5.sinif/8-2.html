<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans p-4 sm:p-6 selection:bg-blue-500 selection:text-white">

    <!-- Üst Bar -->
    <div class="max-w-5xl mx-auto w-full space-y-6 flex-grow flex flex-col">
        <div class="flex items-center justify-between bg-slate-800/90 backdrop-blur p-6 rounded-3xl border border-slate-700 shadow-2xl">
            <div class="space-y-1">
                <span class="bg-cyan-500/20 text-cyan-400 text-xs font-bold px-3 py-1 rounded-full border border-cyan-500/30">5. Sınıf • 8. Hafta Etkinliği</span>
                <h1 class="text-xl sm:text-2xl font-extrabold text-white">İnteraktif Dosya Uzantıları Oyunu</h1>
                <p class="text-slate-400 text-xs">Etkinliği doğrudan sitemiz üzerinden oynayabilir veya tam ekran yapabilirsin.</p>
            </div>
            <a href="javascript:history.back()" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-xs font-bold rounded-xl transition-all shadow-md flex items-center space-x-2 shrink-0">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="hidden sm:inline">Geri Dön</span>

        <!-- Wordwall Oyun Gömme (Embed) Alanı -->
        <div class="bg-slate-800/80 border border-slate-700/80 p-4 sm:p-6 rounded-3xl shadow-2xl flex-grow flex flex-col space-y-4">
            <div class="flex items-center justify-between">

                    <i class="fa-solid fa-gamepad"></i>

                <a href="https://wordwall.net/tr/resource/353953/dosya-uzant%C4%B1lar%C4%B1" target="_blank" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl border border-slate-600 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-external-link-alt text-[10px]"></i>
                    <span>Yeni Sekmede Aç</span>
                </a>
            </div>

            <!-- Doğru Embed Linki ile Iframe Alanı -->
            <div class="w-full flex-grow min-h-[550px] bg-slate-900 border border-slate-700/80 rounded-2xl overflow-hidden relative shadow-inner">
                <iframe src="https://wordwall.net/tr/embed/353953/dosya-uzant%C4%B1lar%C4%B1" width="500" height="380" frameborder="0" allowfullscreen class="w-full h-full absolute inset-0"></iframe>

    <!-- Alt Bilgi -->
    <footer class="bg-slate-800/40 border-t border-slate-800 mt-12 py-6 text-center text-xs text-slate-400">
