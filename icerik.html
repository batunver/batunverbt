<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders İçeriği - BATUNVER BT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-blue-500 selection:text-white">

    <!-- Üst Menü -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 hover:bg-blue-600/30 transition-all">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <span class="text-base font-extrabold tracking-tight text-white block">BATUNVER BT</span>
                    <span class="text-[11px] text-slate-400 block -mt-1">Ders Detay ve Materyal Sayfası</span>
                </div>
            </div>
            <nav class="flex items-center space-x-2">
                <a href="index.html" class="text-xs font-semibold px-3 py-2 rounded-lg bg-slate-700/50 text-white transition-all">Ana Sayfa</a>
            </nav>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
        <div id="detay-container" class="bg-slate-800/80 border border-slate-700/70 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
            <!-- JavaScript ile doldurulacak -->
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p>İçerik yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Alt Bilgi -->
    <footer class="bg-slate-800/40 border-t border-slate-800 mt-16 py-8 text-center text-xs text-slate-400">
        <p>&copy; 2026 BATUNVER BT - İhsan Aras Ortaokulu Bilişim Teknolojileri ve Yazılım Dersi Portalı</p>
    </footer>

    <!-- Veri ve Mantık Scriptleri -->
    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // URL'den 'id' parametresini yakala (Örn: icerik.html?id=5-hafta-1)
            const urlParams = new URLSearchParams(window.location.search);
            const dersId = urlParams.get('id');

            const container = document.getElementById("detay-container");

            if (!dersId || typeof dersData === 'undefined') {
                container.innerHTML = `<div class="text-center py-12 text-red-400"><p>Geçersiz ders ID'si veya veri dosyası bulunamadı.</p></div>`;
                return;
            }

            // data.js içerisinden ilgili ID'ye sahip dersi bul
            const ders = dersData.find(d => d.id === dersId);

            if (!ders) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400"><p>Aradığınız hafta bilgisine ait içerik bulunamadı.</p></div>`;
                return;
            }

            const renk = ders.sinif === "5" ? "blue" : "cyan";

            // Matbu (Şablon) içeriği dinamik olarak ekrana bas
            container.innerHTML = `
                <!-- Üst Bilgi Rozetleri -->
                <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-700/60">
                    <span class="bg-${renk}-500/10 text-${renk}-400 text-xs font-bold px-3.5 py-1.5 rounded-full border border-${renk}-500/20">
                        ${ders.sinif}. Sınıf • ${ders.hafta}. Hafta
                    </span>
                    <span class="text-xs text-slate-300 flex items-center bg-slate-900/50 px-3.5 py-1.5 rounded-xl border border-slate-700">
                        <i class="fa-regular fa-calendar-days mr-2 text-${renk}-400"></i> ${ders.tarih}
                    </span>
                </div>

                <!-- Ünite ve Konu Başlığı -->
                <div class="space-y-2">
                    <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-widest">${ders.unite}</h4>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white">${ders.konu}</h1>
                </div>

                <!-- Açıklama / Detay -->
                <div class="bg-slate-900/50 border border-slate-700/50 rounded-2xl p-6 space-y-3">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center">
                        <i class="fa-solid fa-circle-info mr-2 text-${renk}-400"></i> Konu Özeti ve Açıklama
                    </h3>
                    <p class="text-slate-300 text-sm leading-relaxed">
                        ${ders.aciklama}
                    </p>
                </div>

                <!-- MEB Kazanımı -->
                <div class="bg-${renk}-600/10 border border-${renk}-500/30 rounded-2xl p-6 space-y-2">
                    <h3 class="text-sm font-bold text-${renk}-300 flex items-center">
                        <i class="fa-solid fa-bullseye mr-2"></i> Ders Kazanımı
                    </h3>
                    <p class="text-slate-200 text-sm italic">
                        "${ders.kazanim}"
                    </p>
                </div>

                <!-- Materyaller ve İndirmeler Alanı (Örnek Matbu Alan) -->
                <div class="pt-4 border-t border-slate-700/60 space-y-4">
                    <h3 class="text-base font-bold text-white">Ders Materyalleri ve Etkinlikler</h3>
                    <div class="grid sm:grid-cols-2 gap-4">
                        <a href="#" class="p-4 bg-slate-900/60 border border-slate-700 rounded-xl hover:border-${renk}-500 transition-all flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center font-bold">PDF</div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-${renk}-400 transition-colors">Ders Notu / Sunum</h4>
                                    <span class="text-[11px] text-slate-400">Haftalık ders slaydı</span>
                                </div>
                            </div>
                            <i class="fa-solid fa-download text-slate-400 group-hover:text-white"></i>
                        </a>

                        <a href="#" class="p-4 bg-slate-900/60 border border-slate-700 rounded-xl hover:border-${renk}-500 transition-all flex items-center justify-between group">
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center font-bold">uyg</div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-${renk}-400 transition-colors">Uygulama Dosyası</h4>
                                    <span class="text-[11px] text-slate-400">Örnek çalışma dosyası</span>
                                </div>
                            </div>
                            <i class="fa-solid fa-download text-slate-400 group-hover:text-white"></i>
                        </a>
                    </div>
                </div>
            `;
        });
    </script>
</body>
</html>
