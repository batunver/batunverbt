<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders İçeriği - BATUNVER BT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-blue-500 selection:text-white">

    <!-- Üst Menü (Header) -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="index.html" class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 hover:bg-blue-600/30 transition-all">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div>
                    <span class="text-base font-extrabold tracking-tight text-white block">BATUNVER BT</span>
                    <span class="text-[11px] text-slate-400 block -mt-1">Ders Detay ve Materyal Sayfası</span>
                </div>
            </div>
            <nav class="flex items-center space-x-2">
                <a href="index.html" class="text-xs font-semibold px-3.5 py-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 text-white transition-all">
                    <i class="fa-solid fa-house mr-1.5"></i>Ana Sayfa
                </a>
            </nav>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div id="detay-container" class="bg-slate-800/80 border border-slate-700/70 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
            <!-- Yükleniyor Mesajı -->
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p class="text-sm">İçerik yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Alt Bilgi (Footer) -->
    <footer class="bg-slate-800/40 border-t border-slate-800 mt-16 py-8 text-center text-xs text-slate-400">
        <p>&copy; 2026 BATUNVER BT - İhsan Aras Ortaokulu Bilişim Teknolojileri ve Yazılım Dersi Portalı</p>
    </footer>

    <!-- Veri Dosyası ve Sayfa Mantığı -->
    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // URL'den 'id' parametresini okuma (Örn: icerik.html?id=5-hafta-7)
            const urlParams = new URLSearchParams(window.location.search);
            const dersId = urlParams.get('id');

            const container = document.getElementById("detay-container");

            if (!dersId || typeof dersData === 'undefined') {
                container.innerHTML = `<div class="text-center py-12 text-red-400"><p class="text-sm">Geçersiz ders ID'si veya veri dosyası bulunamadı.</p></div>`;
                return;
            }

            // data.js dosyasından ilgili ders verisini eşleştirme
            const ders = dersData.find(d => d.id === dersId);

            if (!ders) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400"><p class="text-sm">Aradığınız haftaya ait içerik bulunamadı.</p></div>`;
                return;
            }

            const isBeş = ders.sinif === "5";
            const sinifRenk = isBeş ? "blue" : "cyan";

            // Şablon İçeriği Dinamik Oluşturma
            container.innerHTML = `
                <!-- 1. Üst Bilgi Rozetleri -->
                <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-700/60">
                    <span class="${isBeş ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20'} text-xs font-bold px-3.5 py-1.5 rounded-full border">
                        ${ders.sinif}. Sınıf • ${ders.hafta}. Hafta
                    </span>
                    <span class="text-xs text-slate-300 flex items-center bg-slate-900/50 px-3.5 py-1.5 rounded-xl border border-slate-700">
                        <i class="fa-regular fa-calendar-days mr-2 ${isBeş ? 'text-blue-400' : 'text-cyan-400'}"></i> ${ders.tarih}
                    </span>
                </div>

                <!-- 2. Ünite ve Konu Başlığı -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">${ders.unite}</h4>
                    <h1 class="text-2xl
