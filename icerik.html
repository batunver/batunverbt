<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders İçeriği - BATUNVER BT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome İkonlar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-blue-500 selection:text-white">

    <!-- Üst Menü (Header) -->
       <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700/60 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
            
            <!-- Sol Logo Alanı (Alt yazısı ve çizgileriyle tam boy görünüm) -->
            <a href="index.html" class="flex items-center h-20 overflow-hidden group">
                <img src="images/logo2.png" 
                     alt="Batunver - Bilişim Teknolojileri ve Yazılım Öğretmeni" 
                     class="h-20 w-auto object-contain transition-transform duration-300 group-hover:scale-105">
            </a>

            <!-- Sağ Menü Bağlantıları -->
            <nav class="flex items-center space-x-2 sm:space-x-3">
                <a href="index.html" class="text-xs font-semibold px-3.5 py-2 rounded-xl bg-slate-700/80 text-white transition-all shadow-sm">Ana Sayfa</a>
                <button onclick="sinifModalAc('5')" class="text-xs font-semibold px-3.5 py-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700/50 transition-all">5. Sınıf</button>
                <button onclick="sinifModalAc('6')" class="text-xs font-semibold px-3.5 py-2 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700/50 transition-all">6. Sınıf</button>
                <a href="evrak-cantasi.html" class="text-xs font-semibold px-3.5 py-2 rounded-xl text-amber-400 hover:text-amber-300 hover:bg-amber-500/10 transition-all border border-amber-500/30 flex items-center space-x-1.5">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Evrak Çantası</span>
                </a>
            </nav>

        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
        <div id="detay-container" class="bg-slate-800/80 border border-slate-700/70 rounded-3xl p-6 sm:p-10 shadow-2xl space-y-6">
            <!-- Yükleniyor Mesajı -->
            <div id="yukleniyor" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p class="text-sm">İçerik yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Alt Bilgi (Footer) -->
    <footer class="bg-slate-800/40 border-t border-slate-800 mt-16 py-8 text-center text-xs text-slate-400">
        <p>&copy; 2026 BATUNVER BT - İhsan Aras Ortaokulu Bilişim Teknolojileri ve Yazılım Dersi Portalı</p>
    </footer>

    <!-- Veri Dosyası ve Sayfa Mantığı -->
    <script src="data.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            icerigiYukle();
        });

        function icerigiYukle() {
            const container = document.getElementById("detay-container");
            
            // Eğer data.js henüz yüklenmediyse 150ms sonra tekrar dene
            if (typeof dersData === 'undefined') {
                setTimeout(icerigiYukle, 150);
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const dersId = urlParams.get('id');

            // Eğer URL'de ID yoksa varsayılan olarak ilk haftayı (5-hafta-1) göster
            const hedefId = dersId ? dersId : "5-hafta-1";

            const ders = dersData.find(d => d.id === hedefId);

            if (!ders) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-400 space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-400"></i>
                        <p class="text-sm">Aradığınız haftaya ait içerik bulunamadı.</p>
                        <a href="index.html" class="inline-block px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl">Ana Sayfaya Dön</a>
                    </div>`;
                return;
            }

            const isBeş = ders.sinif === "5";

            // Şablon İçeriği Ekrana Bas
            container.innerHTML = `
                <!-- 1. Üst Bilgi Rozetleri -->
                <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-700/60">
                    <span class="${isBeş ? 'bg-blue-500/10 text-blue-400 border-blue-500/20' : 'bg-cyan-500/10 text-cyan-400 border-cyan-500/20'} text-xs font-bold px-3.5 py-1.5 rounded-full border">
                        ${ders.sinif}. Sınıf • ${ders.hafta}. Hafta
                    </span>
                    <span class="text-xs text-slate-300 flex items-center bg-slate-900/50 px-3.5 py-1.5 rounded-xl border border-slate-700">
                        <i class="fa-regular fa-calendar-days mr-2 ${isBeş ? 'text-blue-400' : 'text-cyan-400'}"></i> ${ders.tarih}
                    </span>
                </div>

                <!-- 2. Ünite ve Konu Başlığı -->
                <div class="space-y-2">
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-widest">${ders.unite}</h4>
                    <h1 class="text-2xl sm:text-3xl font-extrabold text-white">${ders.konu}</h1>
                </div>

                <!-- 3. Konu Özeti ve Açıklama -->
                <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-6 space-y-2.5">
                    <h3 class="text-sm font-bold text-slate-300 flex items-center">
                        <i class="fa-solid fa-circle-info mr-2.5 ${isBeş ? 'text-blue-400' : 'text-cyan-400'}"></i> Konu Özeti ve Açıklama
                    </h3>
                    <p class="text-slate-300 text-sm leading-relaxed">
                        ${ders.aciklama}
                    </p>
                </div>

                <!-- 4. Ders Kazanımı -->
                <div class="bg-blue-950/20 border border-blue-500/30 rounded-2xl p-6 space-y-2">
                    <h3 class="text-sm font-bold text-blue-400 flex items-center">
                        <i class="fa-solid fa-bullseye mr-2.5"></i> Ders Kazanımı
                    </h3>
                    <p class="text-slate-200 text-sm italic">
                        "${ders.kazanim}"
                    </p>
                </div>

                <!-- 5. Haftanın Etkinliği / Uygulaması -->
                <div class="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-6 space-y-2.5">
                    <h3 class="text-sm font-bold text-amber-400 flex items-center">
                        <i class="fa-solid fa-lightbulb mr-2.5 text-base"></i> Haftanın Etkinliği / Uygulaması
                    </h3>
                    <p class="text-slate-200 text-sm leading-relaxed font-medium">
                        ${ders.etkinlik ? ders.etkinlik : 'Bu hafta için planlanan sınıf içi uygulama ve etkileşimli etkinlik notu.'}
                    </p>
                </div>

                <!-- 6. Ders Materyalleri ve İndirmeler -->
                <div class="pt-6 border-t border-slate-700/60 space-y-4">
                    <h3 class="text-base font-bold text-white">Ders Materyalleri ve Etkinlikler</h3>
                    <div class="grid sm:grid-cols-2 gap-4">
                        <a href="${ders.link}" target="_blank" class="p-4 bg-slate-900/60 border border-slate-700 rounded-2xl hover:border-blue-500 transition-all flex items-center justify-between group">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-11 h-11 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center font-bold text-xs">PDF</div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-blue-400 transition-colors">Ders Notu / Sunum</h4>
                                    <span class="text-[11px] text-slate-400">Haftalık ders slaydı</span>
                                </div>
                            </div>
                            <i class="fa-solid fa-download text-slate-400 group-hover:text-white text-sm"></i>
                        </a>

                        <a href="${ders.link}" target="_blank" class="p-4 bg-slate-900/60 border border-slate-700 rounded-2xl hover:border-emerald-500 transition-all flex items-center justify-between group">
                            <div class="flex items-center space-x-3.5">
                                <div class="w-11 h-11 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center font-bold text-xs">uyg</div>
                                <div>
                                    <h4 class="text-sm font-bold text-white group-hover:text-emerald-400 transition-colors">Uygulama Dosyası</h4>
                                    <span class="text-[11px] text-slate-400">Örnek çalışma dosyası</span>
                                </div>
                            </div>
                            <i class="fa-solid fa-download text-slate-400 group-hover:text-white text-sm"></i>
                        </a>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
